dependencies {
	testIntegrationImplementation group: "com.liferay.portal", name: "com.liferay.portal.impl", version: "default"
	testIntegrationImplementation group: "org.apache.ant", name: "ant", transitive: false, version: "1.10.14"
	testIntegrationImplementation project(":apps:layout:layout-test-util")
	testIntegrationImplementation project(":apps:portal:portal-verify-test-util")
	testIntegrationImplementation project(":test:arquillian-extension-junit-bridge")
}

tasks.named('testIntegration', Test) {
	def hostNameEnvVarValueAtConfigTime = System.getenv('HOSTNAME')
    println "--------------------------------------------------------------------------------"
    println "DEBUG Gradle (Configuration Phase):"
    println "  OS Environment Variable 'HOSTNAME' as seen by Gradle Daemon: '${hostNameEnvVarValueAtConfigTime}'"
    println "  Is 'hostNameEnvVarValueAtConfigTime' null or empty? ${hostNameEnvVarValueAtConfigTime == null || hostNameEnvVarValueAtConfigTime.isEmpty()}"
    println "--------------------------------------------------------------------------------"

    systemProperty 'host.name', hostNameEnvVarValueAtConfigTime

  	doFirst {
        def hostNameEnvVarValueAtExecTime = System.getenv('HOSTNAME')
        println "--------------------------------------------------------------------------------"
        println "DEBUG Gradle (Execution Phase - doFirst for testIntegration):"
        println "  OS Environment Variable 'HOSTNAME' as seen by Gradle Daemon (again): '${hostNameEnvVarValueAtExecTime}'"
        println "  Is 'hostNameEnvVarValueAtExecTime' null or empty? ${hostNameEnvVarValueAtExecTime == null || hostNameEnvVarValueAtExecTime.isEmpty()}"
        println "  Value actually passed to systemProperty 'host.name': '${hostNameEnvVarValueAtConfigTime}' (from config phase)"
        println "--------------------------------------------------------------------------------"
    }
}